name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio respx
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  gdscript-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gdtoolkit
        run: pip install gdtoolkit
      - name: Lint GDScript files
        run: find godot -name "*.gd" -exec gdstyle {} +
        continue-on-error: true
